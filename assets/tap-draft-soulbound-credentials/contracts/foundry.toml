[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 10000
evm_version = "shanghai"
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read", path = ".." }, { access = "read-write", path = "./deployments" }]
gas_limit = 9223372036854775807
via_ir = true

[lint]
lint_on_build = false
